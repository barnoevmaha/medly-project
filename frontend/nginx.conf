server {
    # nginx:alpine renders this template with envsubst at start, so $PORT comes
    # from the platform (Railway assigns one) rather than being hardcoded.
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames are immutable, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Runtime config must never be cached, or a redeploy pointing at a new API
    # would keep serving the old URL from the browser cache.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # The API, proxied so the browser sees one origin. On two separate
    # *.up.railway.app domains the API's refresh cookie would be third-party,
    # and Safari and Brave block those outright — users would be signed out
    # every 15 minutes. Through here it is first-party, and CORS never applies.
    # MEDLY_API_UPSTREAM is checked and normalised by 18-medly-api.envsh.
    location /api/ {
        proxy_pass ${MEDLY_API_UPSTREAM};
        proxy_http_version 1.1;
        # Host stays the upstream's own name ($proxy_host, nginx's default):
        # Railway's edge routes by it. SNI likewise, for an https upstream.
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The assistant streams over SSE. The API also sends
        # X-Accel-Buffering: no, but nothing here should buffer either way.
        proxy_buffering off;
        proxy_read_timeout 300s;
        # Avatars arrive as data URLs of up to ~400 KB; imaging uploads more.
        client_max_body_size 10m;
    }

    # Client-side routing: every unknown path is handled by the SPA, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
